[global]
    logLevel = "info"
    pid = "./.pid"
    service = "seckill"
    config = "config"

[mysql]
    address = "localhost:3306"
    username = "root"
    password = "123123"
    database = "seckill"

[redis]
    address = "localhost:6379"
    auth = ""
    [redis.DB]
        lock = 0    # 锁相关存储的db
        cron = 1    # 定时任务相关存储的db
        rank = 10   # 榜单相关存储的db
        cache = 11  # 缓存相关存储的db

[etcd]
    endpoints = ["localhost:2379"]

[api]
    bind = "0.0.0.0:8080"
    rpc = "0.0.0.0:8082"
    ttl = 6

[admin]
    bind = "0.0.0.0:8081"

[blacklist]
    filePath = "./blacklist.txt"

# 队列配置: 对应 infrastructure/mq 和 domain/shop
# 读取路径为 queue.<name>.*,<name> 对应代码里的队列标识(如 shop)
[queue]
    [queue.shop]
        # memory 漏桶参数(infrastructure/mq/memory 读取)
        rate = 2000        # 每秒最多消费这么多任务(下游 Redis 保护阀门)
        size = 50000       # 入口队列缓冲(瞬时能接住多少请求,再多会 Produce 失败)
        # worker 协程池参数(domain/shop 读取)
        workerNum = 64     # 并发消费协程数
        workerSize = 2048  # worker 池 chan 缓冲

[protocol]
    gRPC = "gRPC"
    http = "http"
    tcp = "tcp"
